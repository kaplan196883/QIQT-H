category = "regularity"
label = "REGULARITY/BACKGROUND — metric, frame, mode, smoothness, constants, record-law normalization"
name_regex = "^(hsymm|hsymm_gi|hinv|hCg|hCgi|hPP|hPP'|hcong|hT_symm|hbar0|hbar_pos|heta|ha|hφ|hmw|hf2|hf_int|hF0_int|hfd|hf'_meas|hB|hreg|conserv|hm|hVboost|hpp_nn|hpp1|hpp0)$"

# --- LaTeX rendering (consumed by `python -m lean_track latex -c tracks/gr.toml`) ---
# Maps project / Mathlib names to readable math. Keys match a full qualified name or
# its last segment; unmapped names fall back to \mathrm{name}. Values are TOML literal
# strings ('...') so backslashes need no escaping. A value containing #k is an
# APPLIED-NOTATION TEMPLATE: it consumes the next k application arguments (balanced
# (...) groups or single atoms) and substitutes #1.. into the result.
#
# CONVENTION NOTES (please sanity-check the index orders, which the Lean signatures
# fix but the math notation makes a choice about):
#  * covDerivVec g gi V ν μ y  is read as (∇V) with lower direction ν, upper comp μ.
#  * gm (EinsteinEOS.gm) is the Minkowski metric, written η_{kl}; the *capacity*
#    constant is a separate scalar also named η in Lean — both print as η.
#  * BL M v is the quadratic form M(v,v) (used as the null condition BL(g x) v = 0).
[latex.notation]

# spacetime / index sets
"Point"          = 'M^{#1}'                 # Point 4            -> M^4

# metric and inverse metric (variadic variables; arity-aware firing renders the
# 3-arg component form with subscripts and leaves the matrix/bare uses plain)
"g"              = 'g_{#2#3}(#1)'           # g x μ ν            -> g_{μν}(x);  g x stays g x
"gi"             = 'g^{#2#3}(#1)'           # gi y a b           -> g^{ab}(y)  (inverse metric)

# curvature & stress (Curvature.*)
"boxField"       = '(\Box #1)(#4)'          # boxField φ g gi x  -> (□φ)(x)
"kgStress"       = 'T(#5)'                  # kgStress m φ g gi x [μ ν] -> T(x) [μ ν]
                                            # (5-arg natural form: appears both as the
                                            #  tensor T(x) inside BL(...) and fully
                                            #  applied T(x) μ ν in the conclusion)
"einsteinTensor" = 'G_{#3#4}(#5)'           # einsteinTensor g gi μ ν x -> G_{μν}(x)
"ricci"          = 'R_{#3#4}(#5)'           # ricci g gi i j x   -> R_{ij}(x)
"scalarCurv"     = 'R(#3)'                  # scalarCurv g gi y  -> R(y)
"covDerivVec"    = '(\nabla #3)_{#4}{}^{#5}(#6)'   # see convention note
"expansion"      = '\theta(#4)'             # expansion g gi V y -> θ(y)
"pd"             = '\partial_{#2}(#1)(#3)'  # pd f ν x           -> ∂_ν(f)(x)

# stress tensor as an abstract binder (core theorem) + orthonormal frame P
"T"              = 'T_{#2#3}(#1)'           # T x μ ν -> T_{μν}(x);  T x stays the matrix
"P"              = 'P_{#2#3}(#1)'           # P x i k -> P_{ik}(x)  (vierbein / frame)
"Pinv"           = '(P^{-1})_{#2#3}(#1)'    # Pinv x k j -> (P⁻¹)_{kj}(x)

# Einstein equation-of-state layer (EinsteinEOS.*)
"div02"          = '(\nabla\!\cdot #3)_{#4}(#5)'  # div02 g gi T ν x -> (∇·T)_ν(x)
"gm"             = '\eta_{#1#2}'            # Minkowski metric   -> η_{kl}
"BL"             = '(#1)(#2,#2)'            # BL (g x) v         -> (g x)(v,v)

# entropy / probability functionals (BranchLedger.*, RelEntPositivity.*)
"Shannon"        = 'S(#2)'                  # Shannon univ p     -> S(p)
"KL"             = 'D_{\mathrm{KL}}(#2\,\|\,#3)'   # KL univ p q -> D_KL(p‖q)
"S"              = 'S(#1,#2,#3)'            # entropy functional S x v t  -> S(x,v,t)
"KE"             = '\mathrm{KE}(#1,#2,#3)'  # modular-energy functional
"A"              = 'A(#1,#2,#3)'            # horizon-area functional A x v t -> A(x,v,t)
"pp"             = 'p'                      # branch-probability distribution
# per-generator derivative values (scalars; see convention note)
"sd"             = '\dot{S}(#1,#2)'         # entropy derivative   -> Ṡ(x,v)
"ad"             = '\dot{A}(#1,#2)'         # area derivative      -> Ȧ(x,v)
"kd"             = '\dot{K}(#1,#2)'         # modular-energy flux  -> K̇(x,v)

# analysis predicates (Mathlib)
"ContDiff"       = '(#3)\in C^{\infty}'     # ContDiff ℝ ⊤ f     -> (f) ∈ C^∞
"HasDerivAt"     = "(#1)'(#3)=#2"           # HasDerivAt f d a   -> (f)'(a)=d
"Fintype.card"   = '\#'
"card"           = '\#'
"Finset.univ"    = ''
"univ"           = ''
"hbar"           = '\hbar'

# free-field / one-particle support layer (Fock.*, StandardSubspaceModular.*) — light
# atoms; the heavier operator-algebra machinery falls back to \mathrm{name}.
"ppMetric"       = 'g^{\mathrm{pp}}'
"ppMetricInv"    = '(g^{\mathrm{pp}})^{-1}'
"Tkk"            = 'T_{kk}'
