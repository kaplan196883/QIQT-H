# Track config — GR field equations.  Consumed by `python -m lean_track report -c tracks/gr.toml`.
[track]
id = "gr"
title = "GR field equations"
subtitle = "Target 3 — QIQT-H gives the GR field equations (Jacobson route, free KG field)"

[project]
lean_import = "QIQTH"
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]
timeout_sec = 1800

# --- spine (ordered; capstone first) ---
# Capstone is the most-discharged free-field form.  T3-3 localization ladder
# (qiqt_gr_freefield → _localized [hbridge] → _localized' [hFocus] → _nullEnergy [hTkk transparent]
#  → _geom [hWarea]), then T3-1 _thermo: entropy/heat built from a finite record law, with the
# relative-entropy premises (hDnn/hD0) and saturation (hsat) discharged via the finite-core witness.
# Each step strictly stronger / more grounded; all axiom-free.
[[theorems]]
name = "QIQTH.WedgeKMSToGR.qiqt_gr_freefield_thermo"
role = "capstone"
[[theorems]]
name = "QIQTH.WedgeKMSToGR.qiqt_gr_freefield_geom"
role = "spine"
[[theorems]]
name = "QIQTH.WedgeKMSToGR.qiqt_gr_freefield_nullEnergy"
role = "spine"
[[theorems]]
name = "QIQTH.WedgeKMSToGR.qiqt_gr_freefield_localized'"
role = "spine"
[[theorems]]
name = "QIQTH.WedgeKMSToGR.qiqt_gr_freefield_localized"
role = "spine"
[[theorems]]
name = "QIQTH.WedgeKMSToGR.qiqt_gr_freefield"
role = "spine"
[[theorems]]
name = "QIQTH.WedgeKMSToGR.qiqt_gr_explicit_kg"
role = "spine"
[[theorems]]
name = "QIQTH.WedgeKMSToGR.qiqt_gr_from_flux_complete"
role = "spine"
[[theorems]]
name = "QIQTH.QiqtToGR.qiqt_bekenstein_gives_gr"
role = "spine"
[[theorems]]
name = "QIQTH.Fock.CyclicWitness.oneParticleBW_niceWedge_unconditional"
role = "spine"
[[theorems]]
name = "QIQTH.Fock.freeField_oneParticle_hFlux"
role = "spine"
[[theorems]]
name = "QIQTH.Fock.freeField_component_hFlux"
role = "spine"

# --- curation rules (author labels — provenance [C]; first match wins) ---
[[category_rules]]
id = "physics-floor"
category = "physics"
label = "PHYSICS — genuine input (EOM / Clausius / focusing / localization / FQ capacity)"
name_regex = "^(hKG|hbound|hsat|hDnn|hD0|hFocus|hTkk|hbridge|hcap)$"

[[category_rules]]
id = "setup"
category = "setup"
label = "SETUP — per-generator derivative existence / null-congruence kinematics"
name_regex = "^(hS|hK|hA|hVC|hgeo|hequil|hVval|harea|hWx|hWC|hWgeo|hWequil)$"

[[category_rules]]
id = "physics-flux"
category = "physics"
label = "PHYSICS — genuine input (EOM / Clausius / focusing / localization)"
name_regex = "^(hFlux|hflux|hKMS)$"

[[category_rules]]
id = "regularity"
category = "regularity"
label = "REGULARITY/BACKGROUND — metric, frame, mode, smoothness, constants, record-law normalization"
name_regex = "^(hsymm|hsymm_gi|hinv|hCg|hCgi|hPP|hPP'|hcong|hT_symm|hbar0|heta|ha|hφ|hmw|hf2|hf_int|hF0_int|hfd|hf'_meas|hB|hreg|conserv|hm|hVboost|hpp_nn|hpp1|hpp0)$"
