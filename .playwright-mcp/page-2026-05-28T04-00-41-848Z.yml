                      - generic "Rich Text Area. Press ALT-0 for help." [active] [ref=f17e1]:
                        - paragraph [ref=f17e3]: "The Bekenstein-Bousso bound is a Lorentz-invariant limit on the information content of any bounded region of spacetime. Taken literally as a physical information limit on the wave function, and not merely as an entanglement-entropy inequality on a reduced density matrix, this bound has a direct consequence for the measurement problem. The wave function, regarded as a physical object instantiated in spacetime, has finite physical specification precision determined by the holographic capacity of the region. Amplitudes physically within epsilon(R) of 0 are physically equivalent to amplitude exactly 0; amplitudes within epsilon(R) of 1 are physically equivalent to amplitude exactly 1. In any per-run universal wave function, dynamical concentration via decoherence and microscopic initial conditions drives the amplitudes for distinct macroscopic record components toward 0 or 1. Below the resolution floor set by the bound, these amplitudes are 0 or 1 physically: the per-run wave function physically is a single-record state. The macroscopic world, a single realized outcome per run, emerges as a structural consequence of applying the holographic information bound literally to the wave function as a physical state of spacetime. No collapse postulate, no hidden particle positions, no branching worlds, no modal value-rule are required. The Schroedinger / Heisenberg evolution of the underlying field algebra is preserved exactly. The Born rule is preserved exactly. The mathematical home of the bound is the algebraic QFT framework with gravitational dressing; the Type II crossed-product algebra construction of Chandrasekaran-Penington-Witten (2022) and Witten (2022) provides the rigorous infrastructure; the literal physical-instantiation reading of the bound is our additional foundational postulate on top. This is the popular-philosophical companion to the technical paper \"One Wave Function, One World: Finite-Information Regional Algebras and the Macroscopic World from Holographic Constraint\" (Zenodo DOI 10.5281/zenodo.20422040; PhilSci-Archive 29766)."
