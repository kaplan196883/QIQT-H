                - heading "Abstract" [level=2] [ref=e116]
                - paragraph [ref=e117]
                - paragraph [ref=e118]: "We develop a foundational framework for quantum mechanics that combines algebraic quantum field theory with the recent crossed-product / Type II construction of Chandrasekaran-Penington-Witten (2022) and Witten (2022). In ordinary QFT, local algebras of bounded regions are Type III_1, admitting no trace, no Hilbert-space factorization, and UV-divergent entanglement entropy. CPW and Witten show that gravitational dressing, implemented via the crossed product with the modular flow of a reference state, produces a Type II algebra with a semifinite trace and a well-defined renormalized entropy whose differences match the generalized entropy A/(4 l_P^2) + S_matter. We use this algebraic infrastructure as the mathematical home for a foundational axiom (FQ) that we propose: for every per-run physical wave function and every bounded region R, the regional state has renormalized entropy bounded by Q_R := A(boundary R)/(4 l_P^2), with the holographic bound stated in modular-local form via the Araki relative entropy chi_R to a reference state sigma_R, and for spacelike-separated regions admissibility combining as the meet of local predicates. The crossed-product construction is borrowed from CPW/Witten; the holographic bound is postulated as a finite-information axiom in this algebraic setting; the foundational application to the measurement problem is our contribution. We distinguish the formal wave function of standard QM (an idealized ensemble description) from the per-run wave function (whose regional physical content is given by its values on the regional Type II algebras). Under decoherence and microscopic initial conditions, per-run regional states concentrate dynamically on single-record states; the Schrodinger / Heisenberg evolution of the underlying field algebra is preserved exactly; (FQ) operates at the level of regional algebraic content. No collapse, no Bohmian particles, no MWI branches, no modal value-rule are added. The framework is psi-monist (the wave function is the only ontology) and is the natural ensemble-interpretation of standard QM constrained by holographic finite-information. We prove a no-signaling theorem from modular-local admissibility plus microcausality, and an Effective Macroscopic Definiteness Theorem (Theorem 6) via Donald's identity for Araki relative entropy with three explicit hypotheses (branchwise admissibility, record-instantiation cost, operational distinguishability via the Holevo-Fano route). Born statistics from typicality is stated schematically and identified as a key open problem. We state four theorems and identify twelve explicit open problems organized into foundational, algebraic, and empirical categories, and frame the construction as a research program rather than a completed interpretation."
