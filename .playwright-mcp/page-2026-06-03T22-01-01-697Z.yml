      - article [ref=e56]:
        - heading "Searching by Author Name" [level=4] [ref=e58]
        - list [ref=e60]:
          - listitem [ref=e61]:
            - text: Using the
            - strong [ref=e62]: Author(s) field
            - text: produces best results for author name searches.
          - listitem [ref=e63]:
            - text: For the most precise name search, follow
            - strong [ref=e64]: surname(s), forename(s)
            - text: or
            - strong [ref=e65]: surname(s), initial(s)
            - text: "pattern: example Hawking, S or Hawking, Stephen"
          - listitem [ref=e66]:
            - text: For best results on multiple author names,
            - strong [ref=e67]: separate individuals with a ;
            - text: "(semicolon). Example: Jin, D S; Ye, J"
          - listitem [ref=e68]:
            - text: Author names enclosed in quotes will return only
            - strong [ref=e69]: exact matches
            - text: . For example, "Stephen Hawking" will not return matches for Stephen W. Hawking.
          - listitem [ref=e70]: Diacritic character variants are automatically searched in the Author(s) field.
          - listitem [ref=e71]: Queries with no punctuation will treat each term independently.
      - article [ref=e72]:
        - heading "Searching by subcategory" [level=4] [ref=e74]
        - list [ref=e76]:
          - listitem [ref=e77]:
            - text: To search within a subcategory select
            - strong [ref=e78]: All fields
            - text: .
          - listitem [ref=e79]:
            - text: A subcategory search can be combined with an author or keyword search by clicking on
            - strong [ref=e80]: add another term
            - text: in advanced search.
      - heading "Tips" [level=2] [ref=e81]
      - paragraph [ref=e82]: "Wildcards:"
      - list [ref=e83]:
        - listitem [ref=e84]: Use ? to replace a single character or * to replace any number of characters.
        - listitem [ref=e85]: Can be used in any field, but not in the first character position. See Journal References tips for exceptions.
      - paragraph [ref=e86]: "Expressions:"
      - list [ref=e87]:
        - listitem [ref=e88]: TeX expressions can be searched, enclosed in single $ characters.
      - paragraph [ref=e89]: "Phrases:"
      - list [ref=e90]:
        - listitem [ref=e91]: Enclose phrases in double quotes for exact matches in title, abstract, and comments.
      - paragraph [ref=e92]: "Dates:"
      - list [ref=e93]:
        - listitem [ref=e94]:
          - text: Sorting by announcement date will use the year and month the
          - emphasis [ref=e95]: original version
          - text: (v1) of the paper was announced.
        - listitem [ref=e96]:
          - text: Sorting by submission date will use the year, month and day the
          - emphasis [ref=e97]: latest version
          - text: of the paper was submitted.
      - paragraph [ref=e98]: "Journal References:"
      - list [ref=e99]:
        - listitem [ref=e100]:
          - text: If a journal reference search contains a wildcard, matches will be made using wildcard matching as expected. For example,
          - strong [ref=e101]: math*
          - text: will match
          - emphasis [ref=e102]: math
          - text: ","
          - emphasis [ref=e103]: maths
          - text: ","
          - emphasis [ref=e104]: mathematics
          - text: .
        - listitem [ref=e105]:
          - text: If a journal reference search does
          - strong [ref=e106]: not
          - text: contain a wildcard, only exact phrases entered will be matched. For example,
          - strong [ref=e107]: math
          - text: would match
          - emphasis [ref=e108]: math
          - text: or
          - emphasis [ref=e109]: math and science
          - text: but not
          - emphasis [ref=e110]: maths
          - text: or
          - emphasis [ref=e111]: mathematics
          - text: .
        - listitem [ref=e112]:
          - text: "All journal reference searches that do not contain a wildcard are literal searches: a search for"
          - strong [ref=e113]: Physica A
          - text: will match all papers with journal references containing
          - emphasis [ref=e114]: Physica A
          - text: ", but a search for"
          - strong [ref=e115]: Physica A, 245 (1997) 181
          - text: will only return the paper with journal reference
          - emphasis [ref=e116]: Physica A, 245 (1997) 181
          - text: .
