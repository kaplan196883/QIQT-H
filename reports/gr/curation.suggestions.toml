# Suggested category_rules for tracks/gr.toml — NOT applied automatically.
# Generated by the lean-track-state skill ([AI] proposals for surface
# hypotheses the current rules leave uncurated). Review, then fold into
# tracks/gr.toml if you agree. Provenance of each label: [AI].

# hFlux / hflux: the boost heat-flux input  kd = (2π/ℏ)·BL(T)·v  on null
# generators — the Bisognano–Wichmann wedge-modular flux, a genuine physics
# input. (Same gap fixed earlier in lean/mathlib/scripts/list_hypotheses.lean.)
[[category_rules]]
id = "physics-flux"
category = "physics"
label = "PHYSICS — genuine input (EOM / Clausius / focusing / localization)"
name_regex = "^(hFlux|hflux|hKMS)$"

# hm: positivity of the field mass (background constant).
# hVboost: identifies the one-parameter group V_t with the boost unitary —
# the definition of the modular/boost flow, a physics-setup input.
[[category_rules]]
id = "oneparticle-bw"
category = "regularity"
label = "REGULARITY/BACKGROUND — metric, frame, mode, smoothness, constants"
name_regex = "^(hm|hVboost)$"
